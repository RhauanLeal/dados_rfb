# ============================================================
# DADOS RFB - ETL mensal (CNPJ) + API de consulta
# Servidor compartilhado com o Postgres do snfisc, o snfisc e o MinIO.
# Rode o ETL fora do horário de expediente: ele sobe para 6 GB e
# disputa o HDD com o Postgres.
# ============================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dados_rfb-etl
    working_dir: /code
    volumes:
      - ../dados_rfb:/code
      - ../dados_rfb_env:/dados_rfb_env:ro
    env_file:
      - ./.env
    environment:
      - TZ=America/Boa_Vista
      - MEMORY_LIMIT=6G  # Lido pelo etl_rfb2.py p/ dimensionar os chunks (respeitar mem_limit)
    restart: "no"
    # transform em pandas é single-thread (GIL); 1.5 sobra
    cpus: 1.5
    mem_limit: 6g
    mem_reservation: 4g
    shm_size: '1gb'
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    logging: *default-logging
    networks:
      - snfisc-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dados_rfb-api
    working_dir: /code
    volumes:
      - ../dados_rfb:/code
      - ../dados_rfb_env:/dados_rfb_env:ro
    env_file:
      - ./.env
    environment:
      - TZ=America/Boa_Vista
    restart: unless-stopped
    ports:
      # Antes "8001:8000" = aberta para qualquer origem (o Docker ignora o ufw
      # e não há regra 8001 no ufw). O snfisc alcança por dados_rfb-api:8000
      # na rede interna; publique via Nginx se precisar de acesso externo.
      - "127.0.0.1:8001:8000"
    cpus: 1.0
    mem_limit: 1g
    mem_reservation: 512m
    logging: *default-logging
    networks:
      - snfisc-network

networks:
  snfisc-network:
    external: true