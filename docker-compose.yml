services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dados_rfb-etl
    working_dir: /code
    volumes:
      - ../dados_rfb:/code
      - ../dados_rfb_env:/dados_rfb_env:ro
    env_file:
      - ../dados_rfb_env/.env
    environment:
      - TZ=America/Boa_Vista
    restart: no
    # === LIMITES DE MEMÓRIA ===
    mem_limit: 8g            # Máximo 8GB (50% da VM)
    mem_reservation: 4g      # Reserva mínima 4GB
    memswap_limit: 12g       # Máximo total (RAM+Swap) = 12GB
    mem_swappiness: 10       # Baixa prioridade para swap
    # === OTIMIZAÇÕES DOCKER ===
    shm_size: '2gb'        # Pandas precisa de shared memory
    tmpfs:
      - /tmp:size=4G,mode=1777  # tmpfs para IO rápido
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - snfisc-network
networks:
  snfisc-network:
    external: true