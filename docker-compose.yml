services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dados_rfb-etl
    working_dir: /code
    volumes:
      - ../dados_rfb:/code
      - ../dados_rfb_env:/dados_rfb_env:ro
    env_file:
      - ../dados_rfb_env/.env
    environment:
      - TZ=America/Boa_Vista
      - MEMORY_LIMIT=8G  # Informa ao script Python
    restart: no
    # === LIMITES DE MEMÓRIA ===
    mem_limit: 8g            # Máximo 8GB (50% da VM)
    mem_reservation: 4g      # Reserva mínima 4GB
    # === OTIMIZAÇÕES DOCKER ===
    shm_size: '1gb'                   # Suficiente para pandas
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - snfisc-network
networks:
  snfisc-network:
    external: true