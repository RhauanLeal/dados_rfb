services:
  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dados_rfb-etl
    working_dir: /code
    volumes:
      - ../dados_rfb:/code
      - ../dados_rfb_env:/dados_rfb_env:ro
    env_file:
      - ./.env
    environment:
      - TZ=America/Boa_Vista
      - MEMORY_LIMIT=6G  # Lido pelo etl_rfb2.py p/ dimensionar os chunks (respeitar mem_limit)
    restart: no
    # === LIMITES DE RECURSOS ===
    # Servidor COMPARTILHADO (Xeon E5-2609 v2, 4c/4t, 32GB, HDD) com o Postgres
    # do snfisc, o snfisc e o MinIO. O ETL roda 1x/mes, entao os tetos protegem
    # a producao durante a janela de carga.
    cpus: 1.5                # transform em pandas e single-thread (GIL); 1.5 sobra
    mem_limit: 6g            # margem real dentro do orcamento de RAM da maquina
    mem_reservation: 4g      # Reserva mínima 4GB
    # === OTIMIZAÇÕES DOCKER ===
    shm_size: '1gb'                   # Suficiente para pandas
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - snfisc-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dados_rfb-api
    working_dir: /code
    volumes:
      - ../dados_rfb:/code
      - ../dados_rfb_env:/dados_rfb_env:ro
    env_file:
      - ./.env
    environment:
      - TZ=America/Boa_Vista
    restart: unless-stopped
    ports:
      - "8001:8000"
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - snfisc-network

networks:
  snfisc-network:
    external: true